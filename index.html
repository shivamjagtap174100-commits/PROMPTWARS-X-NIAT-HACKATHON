<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivacyGuard — Swiss Precision Client-Side PII Sanitization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function (l) {
        if (l.search.indexOf('?p=') === 0) {
          var params = new URLSearchParams(l.search);
          var routePath = params.get('p');
          if (routePath !== null) {
            var base = l.pathname.replace(/\/+$/, '');
            var clean = routePath.replace(/^\/+/, '');
            window.history.replaceState(null, '', base + (clean ? '/' + clean : '/') + l.hash);
          }
        }
      })(window.location);
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

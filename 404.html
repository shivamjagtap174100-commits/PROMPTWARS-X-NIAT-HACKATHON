<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PrivacyGuard — Redirecting</title>
    <script>
      (function (l) {
        var pathSegmentsToKeep = 1;
        var baseParts = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routeParts = l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/\/+$/, '');
        var query = l.search ? '&' + l.search.slice(1) : '';
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            baseParts +
            '/?p=' +
            encodeURIComponent(routeParts) +
            query +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
